name: 🐘 PHP Lint

on:
  push:
    branches: ["main"]
    paths:
      - "**/*.php"
      - "Dockerfile"
      - "composer.json"
      - ".github/workflows/php-lint.yml"
  pull_request:
    paths:
      - "**/*.php"
      - "Dockerfile"
      - "composer.json"
      - ".github/workflows/php-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: 🔍 Syntax check (PHP 8.5)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐘 Lint all PHP files
        run: |
          docker run --rm \
            -v "$PWD":/app \
            -w /app \
            php:8.5-cli \
            sh -c 'set -e; php -v; find dbconfig.php public -name "*.php" -print0 | xargs -0 -n1 php -l'
